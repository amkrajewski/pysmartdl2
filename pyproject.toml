[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pysmartdl2"
version = "2.1.0"
license = "MIT"
authors = [
  { name="Adam Krajewski", email="adam@phaseslab.org" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
description = "Fast, zero-dependency multithreaded file downloader for Python with mirror fallback, concurrent chunked downloads, pause/resume, rate limiting for CDN compatibility, smart retries, and SHA checksums (modernized pySmartDL fork with proper testing, modern Python support, bugfixes, and MIT license)."
readme = "README.md"
keywords = [
  "pysmartdl",
  "smartdl",
  "download",
  "downloader",
  "download manager",
  "file downloader",
  "download accelerator",
  "parallel download",
  "concurrent download",
  "multithreaded download",
  "multipart download",
  "chunked download",
  "download large files",
  "resumable download",
  "pause resume",
  "auto retry",
  "mirror fallback",
  "speed limit",
  "rate limit",
  "error 429",
  "HTTP 429",
  "progress bar",
  "checksum verification",
  "sha256",
  "dataset downloader",
  "urlretrieve",
  "wget",
  "aria2",
  "zero dependency",
]

requires-python = ">=3.8"
dependencies = [
]

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
    "codecov"
]

[project.urls]
homepage = "https://github.com/amkrajewski/pysmartdl2"
repository = "https://github.com/amkrajewski/pysmartdl2"
"Bug Tracker" = "https://github.com/amkrajewski/pysmartdl2/issues"
"ForkedFrom" = "https://github.com/iTaybb/pySmartDL"
